<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анимированная машинка</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, #87ceeb 60%, #228b22 40%);
        overflow: hidden;
        display: flex;
        align-items: flex-end;
      }

      .road {
        position: relative;
        width: 100%;
        height: 80px;
        background: #333;
        margin-bottom: 20px;
      }

      .road::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 4px;
        background: repeating-linear-gradient(
          to right,
          yellow 0%,
          yellow 20%,
          transparent 20%,
          transparent 40%
        );
        transform: translateY(-50%);
      }

      .car {
        position: absolute;
        width: 200px;
        height: 50px;
        background: #8a2be2;
        border-radius: 10px 10px 3px 3px;
        bottom: 50px;
        left: -200px;
        animation: drive 3s ease-in-out forwards;
      }

      .car::before {
        content: "";
        position: absolute;
        width: 160px;
        height: 35px;
        background: #9370db;
        top: -25px;
        left: 0px;
        border-radius: 8px 8px 0 0;
      }

      .car::after {
        content: "";
        position: absolute;
        width: 35px;
        height: 25px;
        background: #87ceeb;
        top: -20px;
        right: 50px;
        left: auto;
        border-radius: 4px;
      }

      .headlight {
        position: absolute;
        width: 10px;
        height: 8px;
        background: #ffd700;
        top: 15px;
        right: 5px;
        border-radius: 2px;
      }

      .taillight {
        position: absolute;
        width: 10px;
        height: 8px;
        background: #ff0000;
        top: 15px;
        left: 5px;
        border-radius: 2px;
      }

      .wheel {
        position: absolute;
        width: 25px;
        height: 25px;
        background: #333;
        border-radius: 50%;
        bottom: -12px;
        border: 2px solid #666;
      }

      .wheel::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        background: #999;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .wheel.front {
        right: 25px;
      }

      .wheel.back {
        left: 25px;
      }

      @keyframes drive {
        0% {
          left: -200px;
        }
        100% {
          left: calc(100% - 250px);
        }
      }

      .wheel {
        animation: rotate 0.5s linear infinite;
      }

      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="road">
      <div class="car">
        <div class="wheel front"></div>
        <div class="wheel back"></div>
        <div class="headlight"></div>
        <div class="taillight"></div>
      </div>
    </div>
  </body>
</html>
